<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>استديو الشخصيات — بدون قيود</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <h1>الاستديو</h1>
      <button id="newCharBtn" class="primary">+ شخصية جديدة</button>
      <div id="charList" class="char-list"></div>
      <div id="statusBox" class="status-box"></div>
    </aside>

    <main class="main">
      <div id="emptyState" class="empty-state">اختر شخصية من القائمة أو أنشئ واحدة جديدة</div>

      <div id="charView" class="char-view" style="display:none">
        <header class="char-header">
          <h2 id="charName"></h2>
          <div class="tabs">
            <button class="tab-btn active" data-tab="chat">شات</button>
            <button class="tab-btn" data-tab="image">صور</button>
            <button class="tab-btn" data-tab="video">فيديو</button>
            <button class="tab-btn danger" id="deleteCharBtn">حذف الشخصية</button>
          </div>
        </header>

        <section id="tab-chat" class="tab-panel active">
          <div id="chatLog" class="chat-log"></div>
          <form id="chatForm" class="chat-form">
            <input id="chatInput" type="text" placeholder="اكتب رسالتك..." autocomplete="off" />
            <button type="submit" class="primary">إرسال</button>
          </form>
        </section>

        <section id="tab-image" class="tab-panel">
          <form id="imageForm" class="media-form">
            <textarea id="imagePrompt" placeholder="وصف الصورة المطلوبة..."></textarea>
            <div class="row">
              <input id="imageNeg" type="text" placeholder="عناصر غير مرغوبة (اختياري)" />
              <button type="submit" class="primary">توليد صورة</button>
            </div>
          </form>
          <div id="imageGrid" class="media-grid"></div>
        </section>

        <section id="tab-video" class="tab-panel">
          <form id="videoForm" class="media-form">
            <textarea id="videoPrompt" placeholder="وصف الفيديو المطلوب..."></textarea>
            <div class="row">
              <input id="videoDuration" type="number" min="1" max="30" value="4" />
              <button type="submit" class="primary">توليد فيديو</button>
            </div>
          </form>
          <div id="videoGrid" class="media-grid"></div>
        </section>
      </div>
    </main>
  </div>

  <div id="modalOverlay" class="modal-overlay" style="display:none">
    <form id="charForm" class="modal">
      <h3>شخصية جديدة</h3>
      <label>الاسم<input id="f_name" required /></label>

      <label>النمط
        <select id="f_kind">
          <option value="anime">أنمي</option>
          <option value="realistic">حقيقية</option>
        </select>
      </label>

      <label>الجنس
        <select id="f_gender">
          <option value="male">ولد</option>
          <option value="female">بنت</option>
          <option value="femboy">فيمبوي (ولد بمظهر أنثوي)</option>
          <option value="tomboy">تومبوي (بنت بمظهر ذكوري)</option>
        </select>
      </label>

      <label>الدور
        <select id="f_role">
          <option value="حبيب/حبيبة">حبيب/حبيبة</option>
          <option value="صديق/صديقة">صديق/صديقة</option>
          <option value="زوج/زوجة">زوج/زوجة</option>
          <option value="معلم/معلمة">معلم/معلمة</option>
          <option value="خادم/خادمة">خادم/خادمة</option>
          <option value="سيد/سيدة">سيد/سيدة</option>
          <option value="منافس/منافسة">منافس/منافسة</option>
          <option value="غريب/غريبة">غريب/غريبة</option>
          <option value="other">أخرى...</option>
        </select>
        <input id="f_role_other" style="display:none" placeholder="اكتب الدور" />
      </label>

      <label>الصوت
        <select id="f_voice">
          <option value="ناعم وهادئ">ناعم وهادئ</option>
          <option value="أنثوي رقيق">أنثوي رقيق</option>
          <option value="رجولي عميق">رجولي عميق</option>
          <option value="طفولي عالي النبرة">طفولي عالي النبرة</option>
          <option value="حيوي ومتحمس">حيوي ومتحمس</option>
          <option value="بارد وجاد">بارد وجاد</option>
          <option value="مثير وغامض">مثير وغامض</option>
          <option value="other">أخرى...</option>
        </select>
        <input id="f_voice_other" style="display:none" placeholder="اكتب نمط الصوت" />
      </label>

      <label>نوع العلاقة
        <select id="f_relationship">
          <option value="رومانسية">رومانسية</option>
          <option value="صداقة">صداقة</option>
          <option value="زواج">زواج</option>
          <option value="عائلية">عائلية</option>
          <option value="سيطرة/خضوع">سيطرة/خضوع</option>
          <option value="عدائية/تنافسية">عدائية/تنافسية</option>
          <option value="other">أخرى...</option>
        </select>
        <input id="f_relationship_other" style="display:none" placeholder="اكتب نوع العلاقة" />
      </label>

      <label>المظهر<textarea id="f_appearance" required placeholder="وصف المظهر بالتفصيل"></textarea></label>
      <label>الشخصية<textarea id="f_personality" required placeholder="الطابع، طريقة الكلام، الصفات"></textarea></label>
      <label>السياق/القصة (اختياري)<textarea id="f_scenario"></textarea></label>
      <div class="modal-actions">
        <button type="button" id="cancelCharBtn">إلغاء</button>
        <button type="submit" class="primary">إنشاء</button>
      </div>
    </form>
  </div>

  <script src="/app.js"></script>
</body>
</html>
